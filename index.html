<style>
:root{--paper:#f8f3e6;--card:#fffdf6;--ink:#17231a;--line:#b9ae90;--green:#1c6537;--green-d:#124726;--pale:#e4eed9;--warn:#fff1c9;--warn-b:#a8790a;--fs:18px}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-weight:500;line-height:1.55;padding-bottom:5.2rem}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;display:flex;align-items:center;gap:.5rem;padding:.6rem .8rem}
header h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.hb{background:#fff;color:var(--green-d);border:0;border-radius:6px;min-width:3rem;height:2.5rem;padding:0 .6rem;font-weight:700}
main{max-width:760px;margin:0 auto;padding:.8rem}
h2{font-size:1.1rem;margin:1.1rem 0 .5rem;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.2rem,1fr));gap:.45rem}
.pick{background:var(--card);border:2px solid var(--line);border-radius:8px;padding:.4rem .2rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;font-size:.9rem;font-weight:600;line-height:1.25;text-align:center;min-height:5.6rem}
.pick img{width:3rem;height:3rem;border-radius:50%;object-fit:cover}
.pick .emo{font-size:2rem;line-height:3rem;height:3rem}
.pick.on{border-color:var(--green);background:var(--pale);box-shadow:inset 0 0 0 2px var(--green)}
.goals{grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr))}
.goals .pick{flex-direction:row;justify-content:flex-start;text-align:left;min-height:3.6rem;padding:.4rem .6rem;gap:.5rem}
.goals .emo{font-size:1.6rem;line-height:1;height:auto}
.bar{display:flex;align-items:center;gap:.6rem;margin:1.1rem 0 .5rem}
.bar h2{margin:0;flex:1}
.btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:.55rem .9rem;font-weight:700}
.btn.ghost{background:var(--card);color:var(--green-d);border:2px solid var(--green)}
.note{background:var(--warn);border-left:6px solid var(--warn-b);border-radius:6px;padding:.6rem .8rem;margin:.6rem 0}
.hint{background:var(--pale);border-radius:6px;padding:.7rem .8rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:10px;margin:.7rem 0;overflow:hidden}
.top{display:flex;gap:.7rem;padding:.7rem}
.top img{width:6.2rem;height:7.4rem;object-fit:cover;border-radius:6px;flex:none;background:#ddd}
.top .t{flex:1;min-width:0}
.nm{font-size:1.2rem;font-weight:800;line-height:1.25}
.cn{font-weight:700;color:var(--green-d)}
.tag{margin-top:.2rem}
.badge{display:inline-block;background:var(--green-d);color:#fff;border-radius:4px;padding:.1rem .5rem;font-size:.85rem;font-weight:700;margin-top:.35rem}
.star{flex:none;align-self:flex-start;background:var(--card);border:2px solid var(--green);border-radius:6px;width:2.8rem;height:2.8rem;font-size:1.5rem;line-height:1;color:var(--green-d)}
.star.on{background:var(--green);color:#ffd84a}
details{border-top:2px solid var(--line)}
summary{padding:.65rem .8rem;font-weight:700;color:var(--green-d);list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";font-weight:800}
details[open]>summary::after{content:"－"}
.body{padding:0 .8rem .8rem}
.body p{margin:.2rem 0 .6rem}
.body ul{margin:.2rem 0 .7rem;padding-left:1.25rem}
.body li{margin:.25rem 0}
.lab{font-weight:800;margin-top:.6rem}
.crops{display:flex;flex-wrap:wrap;gap:.4rem;margin:.35rem 0 .6rem}
.crop{display:flex;align-items:center;gap:.3rem;background:var(--pale);border-radius:6px;padding:.2rem .5rem .2rem .2rem;font-size:.9rem;font-weight:600}
.crop img{width:1.9rem;height:1.9rem;border-radius:50%;object-fit:cover}
.dose{background:var(--warn);border-radius:6px;padding:.5rem .7rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;z-index:5}
nav button{flex:1;background:none;border:0;padding:.5rem .2rem .6rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;font-size:.9rem;font-weight:700;border-top:4px solid transparent}
nav button.on{color:var(--green-d);border-top-color:var(--green);background:var(--pale)}
nav svg{width:1.7rem;height:1.7rem}
.cnt{background:var(--green);color:#fff;border-radius:999px;padding:0 .45rem;font-size:.8rem;margin-left:.2rem}
.row{display:flex;align-items:center;gap:.6rem;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:.5rem;margin:.5rem 0}
.row img{width:3.2rem;height:3.8rem;object-fit:cover;border-radius:4px}
.row .t{flex:1;min-width:0}
.row button{background:var(--card);border:2px solid var(--line);border-radius:6px;width:2.6rem;height:2.6rem;font-size:1.2rem;font-weight:800}
#toast{position:fixed;left:50%;bottom:6rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.5rem 1rem;border-radius:6px;display:none;z-index:9}
#first{position:fixed;inset:0;background:var(--paper);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center}
#first img{width:9rem;border-radius:10px}
#first .ttl{font-size:1.35rem;font-weight:800;line-height:1.5}
#first button{width:100%;max-width:18rem;padding:.9rem;font-size:1.25rem;font-weight:800;background:var(--green);color:#fff;border:0;border-radius:8px}
#upd{position:fixed;left:.6rem;right:.6rem;bottom:calc(5.6rem + env(safe-area-inset-bottom));background:var(--ink);color:#fff;border-radius:8px;padding:.6rem .7rem;display:flex;align-items:center;gap:.5rem;z-index:15;font-weight:700}
#upd[hidden]{display:none}
#upd span{flex:1}
#upd button{border:0;border-radius:6px;padding:.5rem .8rem;font-weight:800;background:#ffd84a;color:var(--ink)}
#upd #updx{background:none;color:#fff}
.qr{display:block;width:11rem;height:11rem;margin:.4rem auto;background:#fff;padding:.4rem;border-radius:6px;image-rendering:pixelated}
.url{word-break:break-all;font-weight:700;text-align:center}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:6px;padding:.5rem;background:#fff;color:var(--ink)}
</style>

const URL_='https://stanleywoosweeleong.github.io/Zagrifol/';
const store={get(k,d){try{const v=localStorage.getItem('zg_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('zg_'+k,JSON.stringify(v))}catch(e){}}};
let lang=store.get('lang',null),fs=store.get('fs',1),tab='find',crop=null,goal=null,list=store.get('list',[]).filter(i=>P.some(p=>p.id===i)),copyText='';
const FS=['16px','18px','21px'],LBL={zh:'中文',en:'EN',bm:'BM'},ORDER=['zh','en','bm'];
const t=o=>o[lang]||o.zh, $=s=>document.querySelector(s), byId=i=>P.find(p=>p.id===i);
function cropChip(c){return `<span class="crop"><img src="${IMG['c_'+c]}" alt="">${t(CROPS[c])}</span>`}
function card(p,open){
 const on=list.includes(p.id);
 return `<div class="card"><div class="top"><img src="${IMG['p_'+p.id]}" alt="${p.nm}"><div class="t"><div class="nm">${p.nm}</div>${p.cn&&lang==='zh'?`<div class="cn">${p.cn}</div>`:''}<div class="tag">${t(p.tag)}</div><span class="badge">${t(B[p.b])}</span></div><button class="star${on?' on':''}" data-star="${p.id}" aria-label="${t(S.list)}">${on?'★':'☆'}</button></div>
 <details${open?' open':''}><summary>${t(S.more)}</summary><div class="body">
 <div class="lab">${t(S.what)}</div><p>${t(p.d)}</p>
 <div class="lab">${t(S.does)}</div><ul>${t(p.p).map(x=>`<li>${x}</li>`).join('')}</ul>
 ${p.combo?`<div class="lab">${t(S.combo)}</div><p>${p.nm} + ${byId(p.combo).nm}</p>`:''}
 <div class="lab">${t(S.crops)}</div><div class="crops">${p.crops.map(cropChip).join('')}</div>
 <div class="lab">${t(S.pack)}</div><p>${p.pk}</p>
 <div class="lab">${t(S.doseL)}</div><div class="dose">${t(S.dose)}</div>
 </div></details></div>`;
}
function vFind(){
 let h=`<h2>${t(S.crop)}</h2><div class="grid">`+Object.keys(CROPS).map(c=>`<button class="pick${crop===c?' on':''}" data-crop="${c}"><img src="${IMG['c_'+c]}" alt="">${t(CROPS[c])}</button>`).join('')+`</div>`;
 h+=`<h2>${t(S.goal)}</h2><div class="grid goals">`+Object.keys(GOALS).map(g=>`<button class="pick${goal===g?' on':''}" data-goal="${g}"><span class="emo">${GOALS[g].e}</span>${t(GOALS[g])}</button>`).join('')+`</div>`;
 h+=`<div class="bar"><h2>${t(S.res)}</h2>${crop||goal?`<button class="btn ghost" data-clear="1">${t(S.clear)}</button>`:''}</div>`;
 if(!crop&&!goal)return h+`<div class="hint">${t(S.pickHint)}</div>`;
 let m=P.filter(p=>(!crop||p.crops.includes(crop))&&(!goal||p.goals.includes(goal)));
 if(!m.length){h+=`<div class="note">${t(S.noBoth)}</div>`;m=P.filter(p=>p.crops.includes(crop));}
 return h+m.map(p=>card(p,m.length<=2)).join('');
}
function vAll(){return P.map(p=>card(p,false)).join('')}
function listText(){return t(S.listHead)+'\n'+list.map(i=>{const p=byId(i);return '• '+p.nm+(p.cn&&lang==='zh'?' '+p.cn:'')+' ('+p.pk+')'}).join('\n')}
function vList(){
 let h='';
 if(!list.length)h+=`<div class="hint">${t(S.empty)}</div>`;
 else{h+=list.map(i=>{const p=byId(i);return `<div class="row"><img src="${IMG['p_'+p.id]}" alt=""><div class="t"><div class="nm">${p.nm}</div><div>${t(p.tag)}</div><div>${p.pk}</div></div><button data-star="${p.id}" aria-label="${t(S.clear)}">✕</button></div>`}).join('');
  h+=`<p><button class="btn" data-copy="1">${t(S.copy)}</button></p>`;
  if(copyText)h+=`<div class="note">${t(S.copyFail)}</div><textarea rows="${list.length+2}" readonly>${copyText}</textarea>`;
  h+=`<div class="dose">${t(S.dose)}</div>`;}
 h+=`<div class="card" style="margin-top:1.2rem"><details style="border:0"><summary>${t(S.share)}</summary><div class="body"><img class="qr" src="${IMG.qr}" alt="QR"><p class="url">${URL_}</p><p style="text-align:center"><button class="btn" data-link="1">${t(S.copyLink)}</button></p></div></details></div>`;
 h+=`<div class="card"><details style="border:0"><summary>${t(S.about)}</summary><div class="body"><p>${t(S.aboutT)}</p><p>${t(S.ver)}: ${verStr()}</p></div></details></div>`;
 return h;
}
const ICON={find:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
 all:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M9 2h6v3l2 3v13H7V8l2-3z"/><path d="M7 12h10M7 17h10"/></svg>',
 list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9 6.6 19.8l1.1-6.1L3.2 9.4l6.1-.8z"/></svg>'};
function render(){
 document.documentElement.lang=lang==='bm'?'ms':lang;document.documentElement.style.setProperty('--fs',FS[fs]);
 document.title=t(S.title);$('#title').textContent=t(S.title);$('#lang').textContent=LBL[lang];
 $('#main').innerHTML=tab==='find'?vFind():tab==='all'?vAll():vList();
 $('#updt').textContent=t(S.newVer);$('#updgo').textContent=t(S.refresh);
 $('#nav').innerHTML=['find','all','list'].map(k=>`<button class="${tab===k?'on':''}" data-tab="${k}">${ICON[k]}<span>${t(S[k])}${k==='list'&&list.length?`<span class="cnt">${list.length}</span>`:''}</span></button>`).join('');
}
function verStr(){const d=new Date(document.lastModified);if(isNaN(d))return '';const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())}
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1600)}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.l){lang=d.l;store.set('lang',lang);$('#first').style.display='none';render();return}
 if(d.tab){tab=d.tab;copyText='';render();window.scrollTo(0,0);return}
 if(d.crop){crop=crop===d.crop?null:d.crop;render();return}
 if(d.goal){goal=goal===d.goal?null:d.goal;render();return}
 if(d.clear){crop=goal=null;render();return}
 if(d.star){const open=[...document.querySelectorAll('details[open]')].map(x=>x.closest('.card')&&x.closest('.card').querySelector('[data-star]')).filter(Boolean).map(x=>x.dataset.star);
  list=list.includes(d.star)?list.filter(i=>i!==d.star):[...list,d.star];store.set('list',list);copyText='';const y=window.scrollY;render();
  if(tab!=='list')document.querySelectorAll('.card').forEach(c=>{const s=c.querySelector('[data-star]');if(s)c.querySelector('details').open=open.includes(s.dataset.star)});window.scrollTo(0,y);return}
 if(d.copy){const txt=listText();const fail=()=>{copyText=txt;render()};
  try{navigator.clipboard.writeText(txt).then(()=>toast(t(S.copied)),fail)}catch(x){fail()}return}
 if(d.link){try{navigator.clipboard.writeText(URL_).then(()=>toast(t(S.copied)),()=>{})}catch(x){}return}
 if(b.id==='updgo'){location.reload();return}
 if(b.id==='updx'){$('#upd').hidden=true;return}
 if(b.id==='aa'){fs=(fs+1)%3;store.set('fs',fs);render();return}
 if(b.id==='lang'){lang=ORDER[(ORDER.indexOf(lang)+1)%3];store.set('lang',lang);render();return}
});
$('#firstImg').src=IMG.p_magicwet;
if(!lang){lang='zh';$('#first').style.display='flex'}
render();
try{if('serviceWorker' in navigator&&location.protocol!=='file:'&&/github\.io$|^localhost$/.test(location.hostname)){
 const ask=()=>{if(navigator.onLine===false)return;navigator.serviceWorker.ready.then(r=>{if(r.active)r.active.postMessage('check')}).catch(()=>{})};
 navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='updated')$('#upd').hidden=false});
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').then(ask).catch(()=>{})});
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')ask()});
}}catch(e){}
</script>
